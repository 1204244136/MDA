# 正式发行配方；资源由 tools/build_android.py 准备，APK 随桌面包一起进 Release。
# 测试联调仍用 membership.profile.yaml / pr.profile.yaml，包名与本配方不同，可并存安装。
assets: build/membership/assets
include:
  - interface.json
  - README.md
  - AndroidNotice.md
  - LICENSE
  - tasks/**
  - resource/**
  - locales/**
agent:
  sourceDir: build/membership/agent-dist
  abi: [arm64-v8a]
  runtimes:
    - location: nativeLibs
      executable: libgo-service.so
      name: go-service
      env:
        LD_LIBRARY_PATH: "{nativeLibs}"
        MAAFW_BINARY_PATH: "{nativeLibs}"
        MDA_ANDROID_MEMBERSHIP_ENABLED: "1"
logs:
  include:
    - debug/**/*.log
display:
  foreground: false
  presets:
    - label: 720P
      width: 1280
      height: 720
      dpi: 240
app:
  id: mda
  label: MDA
  icon: ../assets/locales/MDA-Tiny.png
# 手机版在 Mirror酱单独发布为 MDA_android；PI 里的 MDA 是桌面包
update:
  mirrorchyanRid: MDA_android
