name: mirrorchyan_release

on:
  workflow_dispatch:
    inputs:
      tag:
        default: ""
        required: false
#   release:
#     types: [released]

# 上传 action 只读 Release 资产；失败通知会创建 Issue，因此需要 issues: write。
permissions:
  contents: read
  issues: write

jobs:
  mirrorchyan:
    runs-on: macos-latest
    if: ${{ github.repository_owner == '1204244136' }}
    strategy:
      fail-fast: false
      matrix:
        os: [win, macos, linux]
        arch: [aarch64, x86_64]
    steps:
      - uses: MirrorChyan/uploading-action@v1
        with:
          filetype: latest-release
          filename: ${{ format('MDA-{0}-{1}-*', matrix.os, matrix.arch) }}
          mirrorchyan_rid: MDA
          tag: ${{ inputs.tag }}

          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}

          owner: 1204244136
          repo: MDA
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}

  # Android 复用桌面 RID MDA，通过 os/arch 区分平台；arch 与 MaaFwApp 的
  # AndroidAbi.ARM64.mirrorArch（arm64）保持一致，客户端按 os=android&arch=arm64 查询。
  mirrorchyan_android:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == '1204244136' }}
    steps:
      - uses: MirrorChyan/uploading-action@v1
        with:
          filetype: latest-release
          filename: MDA-android-arm64-v8a-*
          mirrorchyan_rid: MDA
          tag: ${{ inputs.tag }}

          os: android
          arch: arm64

          owner: 1204244136
          repo: MDA
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}
