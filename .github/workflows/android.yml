name: build-android-apk

# 正式版（v* tag）不在这里单独触发：由 install.yml 以 workflow_call 调用，
# APK 与桌面包一起进 Release，再由 mirrorchyan_release.yml 上传 Mirror酱。
# PR 与手动 debug 仍只产出 Actions 测试包，不接 Release / MirrorChyan。
on:
  pull_request:
    paths:
      - .github/workflows/android.yml
      - .github/workflows/install.yml
      - Android/**
      - assets/**
      - agent/**
      - tools/**
      - pyproject.toml
      - uv.lock
      - .gitmodules
  workflow_dispatch:
    inputs:
      assemble:
        description: "debug 出测试包；release 出正式包（需要正式签名 Secrets）"
        type: choice
        options:
          - debug
          - release
        default: debug
      tag:
        description: "正式 tag（例如 v1.12.3），留空要求 HEAD 正好在 v* tag 上"
        type: string
        default: ""
      maafw_version:
        description: "MaaFramework release tag，留空用 Android/ci-versions.json"
        type: string
        default: ""
  workflow_call:
    inputs:
      assemble:
        type: string
        default: release
      ref:
        description: "构建的 git ref，留空取触发事件的 ref"
        type: string
        default: ""
      tag:
        description: "正式 tag，由 install.yml 传入"
        type: string
        default: ""
      maafw_version:
        description: "MaaFramework release tag，与桌面包保持一致"
        type: string
        default: ""
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_STORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
      # 正式发布不使用测试签名；声明为非必需，避免 workflow_call 的 secrets 上下文缺键。
      ANDROID_TEST_KEYSTORE_BASE64:
        required: false
      ANDROID_TEST_STORE_PASSWORD:
        required: false
      ANDROID_TEST_KEY_ALIAS:
        required: false
      ANDROID_TEST_KEY_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  # tag 发布不能被重跑或删 tag 重建取消，否则 Release 会缺 APK。
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.meta.outputs.mode }}
      version: ${{ steps.meta.outputs.version }}
      version_code: ${{ steps.meta.outputs.version_code }}
      artifact_prefix: ${{ steps.meta.outputs.artifact_prefix }}
      maafw_tag: ${{ steps.meta.outputs.maafw_tag }}
      ndk_version: ${{ steps.meta.outputs.ndk_version }}
      build_tools: ${{ steps.meta.outputs.build_tools }}
      compile_sdk: ${{ steps.meta.outputs.compile_sdk }}
      shell_repository: ${{ steps.meta.outputs.shell_repository }}
      shell_revision: ${{ steps.meta.outputs.shell_revision }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - id: meta
        env:
          ASSEMBLE: ${{ inputs.assemble }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_MAAFW: ${{ inputs.maafw_version }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          meta_args=()
          if [[ -n "${INPUT_MAAFW:-}" ]]; then
            meta_args+=(--maafw-tag "$INPUT_MAAFW")
          fi
          if [[ "${ASSEMBLE:-}" == "release" ]]; then
            tag="${INPUT_TAG:-}"
            if [[ -z "$tag" ]]; then
              tag=$(git describe --tags --exact-match --match "v*" 2>/dev/null) || {
                echo "::error::release 构建必须指定 tag，或让 HEAD 正好在某个 v* tag 上"
                exit 1
              }
            fi
            python tools/android_ci.py release-meta --tag "$tag" "${meta_args[@]}"
          elif [[ "${TRIGGER_EVENT}" == "pull_request" ]]; then
            python tools/android_ci.py meta --pr "${meta_args[@]}"
          else
            python tools/android_ci.py meta "${meta_args[@]}"
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: android-build-metadata
          path: Android/build/ci/metadata.json
          if-no-files-found: error
          retention-days: 14

  agents:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: android-build-metadata
          path: Android/build/ci
      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go-service/go.mod
          cache-dependency-path: agent/go-service/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - uses: android-actions/setup-android@v4
      - name: Install pinned NDK
        env:
          NDK_VERSION: ${{ needs.meta.outputs.ndk_version }}
        run: sdkmanager "ndk;$NDK_VERSION"
      - name: Prepare OCR for resource regression tests
        run: |
          git submodule update --init --depth 1 assets/MaaCommonAssets
          python tools/configure.py
      - name: Check Go and membership mapping
        run: |
          go -C agent/go-service vet ./...
          go -C agent/go-service test ./...
      - name: Verify real Agent callbacks and quota settlement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAAFW_TAG: ${{ needs.meta.outputs.maafw_tag }}
        run: |
          gh release download "$MAAFW_TAG" --repo MaaXYZ/MaaFramework \
            --pattern "MAA-linux-x86_64-$MAAFW_TAG.zip" --output "$RUNNER_TEMP/maafw-host.zip"
          python -m zipfile -e "$RUNNER_TEMP/maafw-host.zip" "$RUNNER_TEMP/maafw-host"
          MDA_MAA_LIB="$RUNNER_TEMP/maafw-host/bin" go -C agent/go-service test \
            ./taskersink/membership -run '^TestAgentQuotaCallbacks$' -count=1 -timeout 30s
      - name: Check Android resources, identity overlay and CI validation
        run: |
          uv run --frozen --only-group install python -m unittest discover -s tools/verify -p 'test_build_android.py'
          uv run --frozen --only-group install python -m unittest discover -s tools/verify -p 'test_android_shell.py'
          uv run --frozen --only-group install python -m unittest discover -s tools/verify -p 'test_android_ci.py'
          javac -d "$RUNNER_TEMP/identity-jvm" Android/shell-overlay/AndroidIdentityCompat.java tools/verify/AndroidIdentityCompatTest.java
          java -cp "$RUNNER_TEMP/identity-jvm" AndroidIdentityCompatTest
      - name: Build and validate arm64 Agent
        env:
          NDK_VERSION: ${{ needs.meta.outputs.ndk_version }}
        run: python tools/android_ci.py agent --ndk "$ANDROID_HOME/ndk/$NDK_VERSION"
      - uses: actions/upload-artifact@v6
        with:
          name: android-agent-arm64
          path: Android/build/membership/agent-dist
          if-no-files-found: error
          retention-days: 14

  apk:
    needs: [meta, agents]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Checkout compatible MaaFwApp
        uses: actions/checkout@v5
        with:
          repository: ${{ needs.meta.outputs.shell_repository }}
          ref: ${{ needs.meta.outputs.shell_revision }}
          path: .cache/android-shell
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: android-build-metadata
          path: Android/build/ci
      - uses: actions/download-artifact@v7
        with:
          name: android-agent-arm64
          path: Android/build/membership/agent-dist
      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go-service/go.mod
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - uses: android-actions/setup-android@v4
      - name: Install pinned Android SDK and NDK
        env:
          NDK_VERSION: ${{ needs.meta.outputs.ndk_version }}
          BUILD_TOOLS: ${{ needs.meta.outputs.build_tools }}
          COMPILE_SDK: ${{ needs.meta.outputs.compile_sdk }}
        run: sdkmanager "ndk;$NDK_VERSION" "build-tools;$BUILD_TOOLS" "platforms;$COMPILE_SDK" 'cmake;3.22.1'
      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ runner.os }}-${{ needs.meta.outputs.shell_revision }}-${{ hashFiles('Android/ci-versions.json') }}
      - name: Prepare resource dependencies
        run: |
          git submodule update --init --depth 1 assets/MaaCommonAssets
          python tools/configure.py
      - name: Prepare release signing
        id: release-signing
        if: needs.meta.outputs.mode == 'release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: python tools/android_ci.py prepare-signing
      - name: Require stable test signing for manual builds
        if: needs.meta.outputs.mode == 'test' && github.event_name == 'workflow_dispatch'
        env:
          ANDROID_TEST_KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
          ANDROID_TEST_STORE_PASSWORD: ${{ secrets.ANDROID_TEST_STORE_PASSWORD }}
          ANDROID_TEST_KEY_ALIAS: ${{ secrets.ANDROID_TEST_KEY_ALIAS }}
          ANDROID_TEST_KEY_PASSWORD: ${{ secrets.ANDROID_TEST_KEY_PASSWORD }}
          ANDROID_TEST_CERT_SHA256: ${{ vars.ANDROID_TEST_CERT_SHA256 }}
        shell: python
        run: |
          import os
          required = ['ANDROID_TEST_KEYSTORE_BASE64', 'ANDROID_TEST_STORE_PASSWORD', 'ANDROID_TEST_KEY_ALIAS', 'ANDROID_TEST_KEY_PASSWORD', 'ANDROID_TEST_CERT_SHA256']
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('缺少固定测试签名配置: ' + ', '.join(missing))
      - name: Build APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ needs.meta.outputs.mode }}
          VERSION: ${{ needs.meta.outputs.version }}
          VERSION_CODE: ${{ needs.meta.outputs.version_code }}
          MAAFW_TAG: ${{ needs.meta.outputs.maafw_tag }}
          NDK_VERSION: ${{ needs.meta.outputs.ndk_version }}
          KEYSTORE_PATH: ${{ steps.release-signing.outputs.path }}
          KEYSTORE_PASSWORD: ${{ needs.meta.outputs.mode == 'release' && secrets.ANDROID_STORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ needs.meta.outputs.mode == 'release' && secrets.ANDROID_KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ needs.meta.outputs.mode == 'release' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          chmod +x .cache/android-shell/gradlew
          args=(
            --skip-agent
            --shell .cache/android-shell
            --ndk "$ANDROID_HOME/ndk/$NDK_VERSION"
            --version "$VERSION"
            --version-code "$VERSION_CODE"
            --maafw-tag "$MAAFW_TAG"
          )
          if [[ "$MODE" == "release" ]]; then
            args+=(--release)
          elif [[ "$MODE" == "pr" ]]; then
            args+=(--membership --pr-build)
          else
            args+=(--membership)
          fi
          uv run --frozen --only-group install python tools/build_android.py "${args[@]}"
      - name: Sign manual test APK with fixed certificate
        if: needs.meta.outputs.mode == 'test' && github.event_name == 'workflow_dispatch'
        env:
          ANDROID_TEST_KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
          ANDROID_TEST_STORE_PASSWORD: ${{ secrets.ANDROID_TEST_STORE_PASSWORD }}
          ANDROID_TEST_KEY_ALIAS: ${{ secrets.ANDROID_TEST_KEY_ALIAS }}
          ANDROID_TEST_KEY_PASSWORD: ${{ secrets.ANDROID_TEST_KEY_PASSWORD }}
          ANDROID_TEST_CERT_SHA256: ${{ vars.ANDROID_TEST_CERT_SHA256 }}
          BUILD_TOOLS: ${{ needs.meta.outputs.build_tools }}
        run: python tools/android_ci.py sign --tools "$ANDROID_HOME/build-tools/$BUILD_TOOLS"
      - name: Validate APK version, Agent, libraries, signature and alignment
        env:
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
          ANDROID_TEST_CERT_SHA256: ${{ vars.ANDROID_TEST_CERT_SHA256 }}
          BUILD_TOOLS: ${{ needs.meta.outputs.build_tools }}
          MODE: ${{ needs.meta.outputs.mode }}
        run: |
          set -euo pipefail
          args=(--tools "$ANDROID_HOME/build-tools/$BUILD_TOOLS")
          if [[ "$MODE" == "release" ]]; then
            args+=(--release)
          elif [[ "$MODE" == "pr" ]]; then
            args+=(--pr)
          fi
          python tools/android_ci.py verify "${args[@]}"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ needs.meta.outputs.artifact_prefix }}-${{ needs.meta.outputs.version }}
          path: |
            Android/build/ci/*.apk
            Android/build/ci/*.sha256
            Android/build/ci/MDA-*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ needs.meta.outputs.mode == 'release' && 90 || 14 }}
      - name: Remove decoded release keystore
        if: always() && needs.meta.outputs.mode == 'release'
        run: rm -rf "$RUNNER_TEMP/mda-release"
