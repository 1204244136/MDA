name: Remove old artifacts

on:
  workflow_dispatch:

jobs:
  remove-old-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # For private repos
    permissions:
      actions: write

    steps:
      - name: Remove old artifacts
        uses: c-hive/gha-remove-artifacts@v1
        with:
          age: "14 days" # 与 Android 志愿者测试包的保留期一致，避免手动清理提前删包
          # Optional inputs
          # skip-tags: true
          # skip-recent: 5
